{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        h1 {
            color: #333;
        }
        p {
            font-size:15px;
            margin: 0 0 10px;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <p>Password reset for: {{ email }}.</p>
        <p>You have reset your password, please use below link to complete login.</p>
        <p>If you did not reset it, you should notify your contact person.</p>
        <p><strong>Link:</strong> <a href="{{ url }}">{{ url }}</a></p>
        <div class="footer">
            <p>Thank you</p>
            <p>111ProKeys Team</p>
        </div>
    </div>
</body>
</html>
